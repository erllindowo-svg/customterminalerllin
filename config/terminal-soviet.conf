# Terminal Soviético — preferências pessoais (versionadas).
#
# Formato: VAR="valor" (sintaxe de shell, sem comandos). Lido por:
#   * install.sh: preenche os modelos *.in (Hyprland, Noctalia, plugins);
#   * scripts em ~/.local/bin (soviet-ops, soviet-bar-sync...): o instalador
#     copia este arquivo para ~/.config/terminal-soviet/terminal-soviet.conf.
# Depois de mudar algo aqui: ./install.sh (reaplica só o que mudou).

# --- Central de operações e barra -------------------------------------------
# Workspace da central (dashboard): barra oculta e janelas fora da lista de tarefas.
HIDDEN_WORKSPACE="1"
# Classes (regex jq) que também ocultam a barra no workspace onde estão,
# ex.: "^firefox$". Vazio (padrão) = só o workspace da central oculta a barra.
COLLAPSE_CLASSES=""
# Nome da barra no Noctalia (noctalia/config/20-barra.toml.in).
BAR_NAME="estacao"

# --- Clima ------------------------------------------------------------------
# Endereço resolvido pelo serviço de clima do Noctalia (Open-Meteo). Sem
# geolocalização por IP.
WEATHER_ADDRESS="Rio de Janeiro, RJ, Brasil"

# --- Atalhos (formato do Omarchy/Hyprland Lua: "SUPER + ALT + A") -----------
KEY_INSPECT="SUPER + M"          # painel btop flutuante sob demanda
KEY_OPS="SUPER + CTRL + M"       # recompor a central
KEY_ARTE="SUPER + ALT + A"       # ilustração: menu + arttime interativo

# --- Barra: aplicativos fixados ---------------------------------------------
# SEMENTE dos fixados (à direita da barra): "desktop-id:classe1,classe2" separados
# por espaço (classes em minúsculas; o desktop-id abre o app e fornece o ícone).
# Só vale na primeira execução: depois, fixar/desafixar pelo clique direito grava
# ~/.local/state/noctalia/plugins/data/erllan/tarefas/fixados.json, que passa a
# valer. Apague esse arquivo para voltar a esta lista.
FAVORITES="foot:foot chromium:chromium org.gnome.Nautilus:org.gnome.nautilus cursor:cursor obsidian:obsidian,md.obsidian.obsidian firefox:firefox osu-lazer:osu!"

# --- Barra: ações do centro ---------------------------------------------------
# Jogo com botão próprio entre as ações (desktop-id do .desktop, ex.: o que a Steam
# cria em ~/.local/share/applications). Vazio ou não instalado = sem botão.
GAME_DESKTOP="Deadlock"

# --- Tema de boot do Limine (opcional; scripts/install-limine-theme.sh) -----
# Não é aplicado pelo ./install.sh: o tema mexe em /boot e pede sudo. Veja
# docs/boot-theme.md. Depois de mudar algo aqui: scripts/install-limine-theme.sh --install.
# Variante de cores: fosforo (verde do tema), ambar (dosímetro) ou fallout
# (valores originais do fallout-limine-theme, só para comparação).
LIMINE_THEME="fosforo"
# Fundo: "arte" (tela CRT do fallout-grub-theme, baixada por commit fixo, sem o
# Vault Boy e o texto) ou "zero" (varredura e moldura desenhadas, sem arte de terceiros).
LIMINE_ORIGEM="arte"
# Fonte do menu: "terminus" (Terminus IBM-437, pacote terminus-font, OFL) ou
# "phxega" (PHXEGA8.F14 do fallout-limine-theme, licença não declarada; nunca versionada).
LIMINE_FONTE="terminus"
# Resolução para que o papel de parede é gerado (a do monitor); também define a
# escala da fonte (altura ÷ 540: 2x2 em 1080p).
LIMINE_RESOLUCAO="1920x1080"
# Título no topo da tela (ASCII; a fonte é CP437). Vazio = sem título.
LIMINE_TITULO="TERMINAL SOVIETICO"
# Segundos até iniciar a entrada padrão.
LIMINE_TIMEOUT="15"
