# Terminal Soviético — preferências pessoais (versionadas).
#
# Formato: VAR="valor" (sintaxe de shell, sem comandos). Lido por:
#   * install.sh: preenche os modelos *.in (Hyprland, Noctalia, plugin de tarefas);
#   * scripts em ~/.local/bin (soviet-ops, soviet-bar-sync...): o instalador
#     copia este arquivo para ~/.config/terminal-soviet/terminal-soviet.conf.
# Depois de mudar algo aqui: ./install.sh (reaplica só o que mudou).

# --- Central de operações e barra -------------------------------------------
# Workspace da central (dashboard): barra oculta e janelas fora da lista de tarefas.
HIDDEN_WORKSPACE="1"
# Classes (regex jq) que também ocultam a barra no workspace onde estão.
# Vazio = só o workspace da central oculta a barra.
COLLAPSE_CLASSES="^firefox$"
# Nome da barra no Noctalia (noctalia/config/20-barra.toml.in).
BAR_NAME="estacao"

# --- Clima ------------------------------------------------------------------
# Endereço resolvido pelo serviço de clima do Noctalia (Open-Meteo). Sem
# geolocalização por IP.
WEATHER_ADDRESS="Rio de Janeiro, RJ, Brasil"

# --- Atalhos (formato do Omarchy/Hyprland Lua: "SUPER + ALT + A") -----------
KEY_INSPECT="SUPER + M"          # painel btop flutuante sob demanda
KEY_OPS="SUPER + CTRL + M"       # recompor a central
KEY_ARTE="SUPER + ALT + A"       # ilustração: menu + arttime interativo

# --- Barra: favoritos e lançadores -------------------------------------------
# Favoritos da lista de tarefas: "desktop-id:classe1,classe2" separados por espaço
# (classes em minúsculas; o desktop-id abre o app e fornece o ícone).
FAVORITES="foot:foot chromium:chromium org.gnome.Nautilus:org.gnome.nautilus cursor:cursor obsidian:obsidian,md.obsidian.obsidian spotify:spotify"
# Lançadores fixos à direita da barra (definidos em 20-barra.toml.in).
# Os que não estiverem instalados são omitidos automaticamente.
BAR_LAUNCHERS="firefox osu"
# Sensores de GPU na barra: auto (só com nvidia-smi), yes ou no.
GPU_SENSORS="auto"
