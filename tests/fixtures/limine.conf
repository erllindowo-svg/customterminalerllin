### Read more at config document: https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md
#timeout: 3
default_entry: 2
interface_branding: Omarchy Bootloader
interface_branding_color: 9ece6a
interface_help_color: 9ece6a
interface_help_color_bright: 9ece6a
hash_mismatch_panic: no

term_background: 1a1b26
backdrop: 1a1b26

# Terminal colors (Tokyo Night palette)
term_palette: 15161e;f7768e;9ece6a;e0af68;7aa2f7;bb9af7;7dcfff;a9b1d6
term_palette_bright: 414868;f7768e;9ece6a;e0af68;7aa2f7;bb9af7;7dcfff;c0caf5

# Text colors
term_foreground: c0caf5
term_foreground_bright: c0caf5
term_background_bright: 24283b

/+Omarchy
comment: Omarchy (linux-omarchy)
comment: machine-id=0123456789abcdef0123456789abcdef order-priority=50

  //linux-omarchy
  comment: kernel-id=linux-omarchy
  protocol: efi
  path: boot():/EFI/Linux/omarchy_linux.efi#b2b3c4d5e6f70123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcd
  cmdline: quiet splash

  //linux-omarchy (fallback)
  comment: kernel-id=linux-omarchy-fallback
  protocol: efi
  path: boot():/EFI/Linux/omarchy_linux-fallback.efi

  //Snapshots
    ///2026-10-13 12:00:00 (atualização)
    comment: snapshot 42
    protocol: efi
    path: boot():/limine_history/omarchy_linux_42.efi
