# Terminal Soviético — lista de aplicativos estilo Windows: abertos à esquerda,
# fixados à direita, fixar/desafixar pelo clique direito. Todas as janelas,
# exceto as do workspace da central. Um único `socat` (service `fonte`)
# alimenta os dois widgets por noctalia.state.
id = "erllan/tarefas"
name = "Tarefas"
version = "2.0.0"
plugin_api = 34   # 26: noctalia.getSetting (posição da barra); 34: hover_highlight por widget
author = "erllan"
license = "MIT"
dependencies = ["hyprctl", "socat", "jq", "uwsm-app"]
icon = "apps"
description = "Apps abertos (esquerda) e fixados (direita), exceto o workspace da central; eventos do Hyprland."

[[service]]
id = "fonte"
entry = "fonte.luau"

# Widgets com vários ícones: sem o realce da barra (acenderia todos juntos); cada
# ícone faz o próprio realce (comum.luau).
[[widget]]
id = "abertos"
entry = "abertos.luau"
hover_highlight = false

[[widget]]
id = "fixados"
entry = "fixados.luau"
hover_highlight = false

# Só as ferramentas de trabalho (WORK_APPS), na barra horizontal.
[[widget]]
id = "trabalho"
entry = "trabalho.luau"
hover_highlight = false

[[panel]]
id = "menu"
entry = "menu.luau"
width = 220
height = 190
placement = "attached"
position = "auto"
open_near_click = true
capture_keys = ["escape"]

# "Editar barra": arrastar ícones entre Abertos e Fixados e reordenar (a barra em
# si não tem arrasto no 5.0.1).
[[panel]]
id = "editar"
entry = "editar.luau"
width = 460
height = 250
placement = "attached"
position = "auto"
open_near_click = true
capture_keys = ["escape"]
